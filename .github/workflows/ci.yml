name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        # The siblings are not on PyPI yet, so they are installed from their repositories
        # first and `pip install -e .[dev]` then finds the requirements already satisfied.
        # They are @main, so a sibling change this repository depends on lands there first.
        run: |
          python -m pip install --upgrade pip
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@main"
          # Temporarily the ooxml-edit branch with undo scopes (uvrt/ooxml-edit#17); back to
          # @main once it is merged.
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@prod-feedback-fixes"
          python -m pip install "pptx2svg[png] @ git+https://github.com/uvrt/pptx2svg@main"
          python -m pip install -e .[dev,png]

      # The PowerPoint oracle tests are opt-in (`-m oracle`) and need macOS with
      # PowerPoint, which no runner has; the provider tests need an API key, which CI does
      # not hold; tests that read local trial or spike output skip where it is absent.
      - name: Test
        run: python -m pytest -q

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
