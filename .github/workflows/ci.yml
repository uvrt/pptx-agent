name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Nightly, so a sibling's change that breaks this repository shows the next morning
  # rather than at the next push here.  The seven repositories' crons are staggered,
  # libraries first: ooxml-common 02:07, ooxml-edit 02:17, pptx2svg 02:37, docx2svg 02:47,
  # pptx-agent 03:07, docx-agent 03:17, xlsx-agent 03:27 (UTC).  The whole matrix, as a
  # push runs it.
  schedule:
    - cron: "7 3 * * *"

# One run per pull request at a time: a new push to it cancels the run for the push
# before.  A push to main, the nightly run and a manual run are never cancelled and never
# wait: their group ends in the run's own id (a group keeps one pending run and drops the
# one before it, so a shared group would drop a queued run of main).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14", "3.15"]
        # On a pull request macOS runs only the oldest and the newest Python (3.10 and
        # 3.15): its runners are the scarce ones, and a pull request mostly waited for
        # them.  Ubuntu and Windows still run every version there.  A push to main, the
        # nightly run and a manual run take the whole matrix.  The job names stay
        # `test (<os>, <python>)`, which branch protection matches.
        exclude: ${{ github.event_name == 'pull_request' && fromJSON('[{"os":"macos-latest","python-version":"3.11"},{"os":"macos-latest","python-version":"3.12"},{"os":"macos-latest","python-version":"3.13"},{"os":"macos-latest","python-version":"3.14"}]') || fromJSON('[]') }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          # 3.15.0 is out (2026-10-09) but setup-python's version list may still offer only
          # its release candidates; this takes a final release whenever there is one, so
          # it changes nothing for 3.10 to 3.14.
          allow-prereleases: true

      - name: Install
        # The siblings are not on PyPI yet, so they are installed from their repositories
        # first and `pip install -e .[dev]` then finds the requirements already satisfied.
        # They are @main, so a sibling change this repository depends on lands there first.
        run: |
          python -m pip install --upgrade pip
          # TEMPORARY (r46raw): ooxml-common from its branch until it is merged; back to @main then.
          python -m pip install "ooxml-common @ git+https://github.com/uvrt/ooxml-common@r46-raw-copy"
          # TEMPORARY (r46raw): ooxml-edit from its branch until it is merged; back to @main then.
          python -m pip install "ooxml-edit @ git+https://github.com/uvrt/ooxml-edit@r46-raw-copy"
          python -m pip install "pptx2svg[png] @ git+https://github.com/uvrt/pptx2svg@main"
          # The fonts a render draws with, as the README installs them: without them a runner
          # with no CJK font leaves the fixtures' Japanese out of every PNG (and says so).
          python -m pip install "pptx2svg-fonts @ git+https://github.com/uvrt/pptx2svg@main#subdirectory=packages/pptx2svg-fonts"
          python -m pip install -e .[dev,png]

      # The PowerPoint oracle tests are opt-in (`-m oracle`) and need macOS with
      # PowerPoint, which no runner has; the provider tests need an API key, which CI does
      # not hold; tests that read local trial or spike output skip where it is absent.
      #
      # On every core: pytest-xdist is installed here, not in the dev extra, so a bare
      # local `pytest` stays serial; the 30 slowest tests are listed.
      - name: Test
        run: |
          python -m pip install "pytest-xdist>=3"
          python -m pytest -q -n auto --durations=30

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      # pyproject.toml's version, and __version__, must be the one CHANGELOG.md's top
      # version section names: the tag workflow tags that version when it reaches main.
      - name: The version agrees with CHANGELOG.md
        run: python tools/check_version.py
      # pyflakes and a few bug-finding rules ([tool.ruff] in pyproject.toml), at the dev
      # extra's pin.  Type checking is not on here yet: mypy still reports too much.
      - name: Lint (ruff)
        run: |
          python -m pip install "ruff==0.17.2"
          ruff check .
      - name: Build distributions
        run: |
          python -m pip install --upgrade pip build twine
          python -m build
          python -m twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
